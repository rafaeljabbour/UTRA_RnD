# Camera index, video file path, or rtsp:// or http:// URL.
source: 0

model:
  # Baked detector used at runtime. Point this at a fine tuned .pt to swap models.
  weights: models/robot_detector.pt
  # Open vocabulary base model and prompts, only used by `utra-track prepare`.
  base: yoloe-26m-seg.pt
  classes:
    - white disk robot
    - mobile robot
    - robot car

detect:
  conf: 0.25
  iou: 0.5
  imgsz: 640
  # auto picks cuda when available, otherwise cpu.
  device: auto

tracker: bytetrack.yaml
display: true

output:
  dir: runs
  # Off by default so faces of people near the maze are never stored.
  save_video: false

# The maze as seen by the overhead camera, one string per row of 1 ft cells.
# . open floor, # block, L loading zone, B drop off. S and E are spare letters for custom zones.
# Row 0 is the loading zone side. This is the layout drawn in the Milestone 2 and 3 rubrics.
arena:
  layout:
    - "LL..#B#B"
    - "LL#....."
    - ".#B##.#."
    - "......#B"
  cell_ft: 1.0
  # Written by `utra-track calibrate`. Without it the whole frame is treated as the maze.
  calibration: config/arena_calibration.json
  # The camera sees the top of the rover, which sits above the floor and looks shifted away
  # from the image centre. Set the lens height to correct for it, null leaves it off.
  camera_height_ft: null
  robot_height_ft: 0.5

grading:
  # Autograder: follow the robot from the start zone to the end zone. false shows the plain tracker.
  enabled: true
  team: ""
  run: ""
  # Zones are layout letters ("L", "B", "S", "E", or several like "LS"),
  # or a list of [col, row] cells counted from 0, e.g. [[7, 3]] for the bottom right cell.
  start_zone: L
  end_zone: B
  # Share of the robot outline that must be inside a zone to count as in it.
  zone_share: 0.5
  # The clock starts once the robot moves this far from where it was placed.
  start_move_ft: 0.25
  # The run ends as soon as the robot has been still inside the end zone this long.
  settle_s: 2.0
  # The run ends as a fail after this many seconds. null means no limit.
  time_limit_s: 480
  # Wall contact tracking from the camera, reported in the result only.
  # Toggle live with the c key, or --no-collisions.
  collisions: true
  # mask uses the segmentation outline of the rover, box uses its bounding box.
  footprint: mask
  # Contact shallower than this is ignored as detector noise (0.04 ft is about half an inch).
  contact_margin_ft: 0.04
  # A contact is major when it goes this deep into a wall or lasts this long.
  major_depth_ft: 0.15
  major_duration_s: 1.0
  # Frames of contact needed to log a collision, and frames clear before it ends.
  contact_frames: 3
  release_frames: 6
